name: Daily Iron Condor Run

on:
  schedule:
    # UTC 22:00 = ET 17:00 (EDT) / 18:00 (EST)
    # Mon-Fri only; trading_calendar.py guards against US holidays inside the script.
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

# Prevent overlapping runs (a slow run must finish before the next one starts)
concurrency:
  group: daily-run
  cancel-in-progress: false

permissions:
  contents: write   # needed to push ledger updates back to main

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Trading-day guard
        id: cal
        run: uv run python -m data_source.trading_calendar
        continue-on-error: true

      - name: Skip on non-trading day
        if: steps.cal.outcome != 'success'
        run: |
          echo "Non-trading day, exiting cleanly."
          exit 0

      - name: Run daily pipeline
        if: steps.cal.outcome == 'success'
        env:
          MARKETDATA_API_KEY: ${{ secrets.MARKETDATA_API_KEY }}
        run: uv run python daily_run.py

      - name: Commit and push ledger updates
        if: steps.cal.outcome == 'success'
        run: |
          if [[ -z "$(git status --porcelain data/)" ]]; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name  "iron-condor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ledger.json data/cache.sqlite
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          git commit -m "chore(data): ${DATE} run [skip ci]"
          git push origin HEAD:main
