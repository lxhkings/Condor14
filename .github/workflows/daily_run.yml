name: Daily Iron Condor Run

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: daily-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Build static site
        env:
          SITE_HOST: iron-condor-tracker.vercel.app
        run: uv run python build_site.py

      - name: Commit and push site updates
        run: |
          if [[ -z "$(git status --porcelain public/)" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "iron-condor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/
          git commit -m "chore(site): rebuild static site [skip ci]"
          git push origin HEAD:main
