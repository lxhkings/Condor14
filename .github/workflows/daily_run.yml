name: Daily Iron Condor Run

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: daily-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Trading-day guard
        id: cal
        run: uv run python -m data_source.trading_calendar
        continue-on-error: true

      - name: Skip on non-trading day
        if: steps.cal.outcome != 'success'
        run: |
          echo "Non-trading day, exiting cleanly."
          exit 0

      - name: Run daily pipeline (data)
        if: steps.cal.outcome == 'success'
        env:
          MARKETDATA_API_KEY: ${{ secrets.MARKETDATA_API_KEY }}
        run: uv run python daily_run.py

      - name: Build static site
        if: steps.cal.outcome == 'success'
        env:
          SITE_HOST: iron-condor-tracker.vercel.app
        run: uv run python build_site.py

      - name: Commit and push data + site updates
        if: steps.cal.outcome == 'success'
        working-directory: ${{ github.workspace }}
        run: |
          if [[ -z "$(git status --porcelain stock/data/ stock/public/)" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "iron-condor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stock/data/ledger.json stock/data/cache.sqlite stock/data/last_indexed.json stock/public/
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          git commit -m "chore(data): ${DATE} run [skip ci]"
          git push origin HEAD:main
