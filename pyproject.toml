[project]
name = "iron-condor-pseo"
version = "0.1.0"
description = "Daily Iron Condor PSEO data pipeline"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
    "pandas-market-calendars>=4.4,<5.0",
    "jinja2>=3.1,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-mock>=3.12,<4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
