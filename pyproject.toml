[project]
name = "iron-condor-pseo"
version = "0.1.0"
description = "Daily Iron Condor PSEO data pipeline + static site generator"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
    "pandas-market-calendars>=4.4,<5.0",
    "jinja2>=3.1,<4.0",
    "markdown-it-py>=3.0,<4.0",
    "socksio>=1.0.0",
    "massive>=2.6.0",
    "ib-insync>=0.9.86",
    "futu-api>=10.7.6708",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-mock>=3.12,<4.0",
    "pyyaml>=6.0,<7.0",
    "Pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
